<main>
  <section>
    <h2>Podsumowanie</h2>
    <div id="podsumowanie">
      <!-- JS wstawi produkty -->
    </div>
    <p><strong>Suma:</strong> <span id="suma">0 zł</span></p>

  <section>
    <h2>Dane klienta</h2>

    <form id="formularz">
      <label>
        Imię:
        <input type="text" name="imie" required>
      </label>

      <br><br>

      <label>
        Email:
        <input type="email" name="email" required>
      </label>

      <br><br>

      <button type="submit">Złóż zamówienie</button>
    </form>
  </section>

<footer>
  <p>Dziękujemy za zakupy!</p>
</footer>
